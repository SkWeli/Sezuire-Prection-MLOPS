stages:
  tusz_all:
    desc: >
      Run the full TUSZ pipeline: preprocessing, SHACL validation placeholder,
      and seizure detection model training with MLflow tracking.

    cmd: >
      python main.py --dataset tusz --stage all

    deps:
      - main.py
      - src/preprocessing/tusz_loader.py
      - src/training/train.py
      - data/raw/tusz/dev/aaaaaajy

    outs:
      - data/processed/tusz/aaaaaajy